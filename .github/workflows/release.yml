name: Build and Release

on:
  push:
    paths:
      - "VERSION"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        run: |
          v=$(tr -d '[:space:]' < VERSION)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build all platforms
        run: |
          build() {
            os=$1 arch=$2 armv=$3 name=$4
            echo "Building proxy-$name ($os $arch)..."
            bin="proxy-$name"
            if [ "$os" = "windows" ]; then
              bin="${bin}.exe"
            fi
            GOOS=$os GOARCH=$arch GOARM=$armv CGO_ENABLED=0 go build -o "$bin" .
            if [ "$os" = "windows" ]; then
              zip "${bin%.exe}.zip" "$bin"
            else
              tar czf "${bin}.tar.gz" "$bin"
            fi
          }
          build linux amd64 "" linux-amd64
          build linux arm64 "" linux-arm64
          build linux arm 7 armv7hf-linux
          build darwin amd64 "" mac-intel
          build darwin arm64 "" mac-arm64
          build freebsd amd64 "" freebsd-amd64
          build windows amd64 "" windows-amd64

      - name: List packages
        run: ls -lh *.tar.gz *.zip 2>/dev/null || echo "No packages yet"

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          echo "Creating release $tag..."

          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists. Uploading assets to it..."
            gh release upload "$tag" *.tar.gz *.zip --clobber
          else
            gh release create "$tag" \
              *.tar.gz *.zip \
              --title "$tag" \
              --notes "Docker-quck-proxy $tag" \
              --verify-tag=false
          fi
          echo "✅ Done! Release: https://github.com/${{ github.repository }}/releases/tag/$tag"
