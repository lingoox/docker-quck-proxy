name: Build and Release

on:
  workflow_dispatch:
  push:
    paths:
      - 'VERSION'

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash |
          version="$(tr -d '[:space:]' < VERSION)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"

  build:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
            goarm: 7
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: freebsd
            goarch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm | default '' }}
          CGO_ENABLED: 0
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash |
          if [ "${matrix.goos}" = "linux" ] && [ "${matrix.goarch}" = "arm" ]; then
            platform="armv7hf-linux"
            output="proxy-armv7hf-linux"
          elif [ "${matrix.goos}" = "darwin" ] && [ "${matrix.goarch}" = "arm64" ]; then
            platform="mac-arm64"
            output="proxy-mac-arm64"
          elif [ "${matrix.goos}" = "darwin" ] && [ "${matrix.goarch}" = "amd64" ]; then
            platform="mac-intel"
            output="proxy-mac-intel"
          elif [ "${matrix.goos}" = "freebsd" ] && [ "${matrix.goarch}" = "amd64" ]; then
            platform="freebsd-amd64"
            output="proxy-freebsd-amd64"
          elif [ "${matrix.goos}" = "linux" ] && [ "${matrix.goarch}" = "amd64" ]; then
            platform="linux-amd64"
            output="proxy-linux-amd64"
          elif [ "${matrix.goos}" = "linux" ] && [ "${matrix.goarch}" = "arm64" ]; then
            platform="linux-arm64"
            output="proxy-linux-arm64"
          else
            # windows
            output="proxy-windows-amd64.exe"
          fi
          echo "Building $output for ${GOOS}/${GOARM:-${GOARCH}}..."
          CGO_ENABLED=0 go build -o "$output" .
          echo "Built $output"

      - name: Package Unix-like
        if: matrix.goos != 'windows'
        shell: bash |
          if [ "${matrix.goos}" = "linux" ] && [ "${matrix.goarch}" = "arm" ]; then
            tar czf "proxy-armv7hf-linux.tar.gz" "proxy-armv7hf-linux" || echo "Failed to package armv7hf"
          elif [ "${matrix.goos}" = "darwin" ] && [ "${matrix.goarch}" = "arm64" ]; then
            tar czf "proxy-mac-arm64.tar.gz" "proxy-mac-arm64" || echo "Failed to package mac-arm64"
          elif [ "${matrix.goos}" = "darwin" ] && [ "${matrix.goarch}" = "amd64" ]; then
            tar czf "proxy-mac-intel.tar.gz" "proxy-mac-intel" || echo "Failed to package mac-intel"
          elif [ "${matrix.goos}" = "freebsd" ] && [ "${matrix.goarch}" = "amd64" ]; then
            tar czf "proxy-freebsd-amd64.tar.gz" "proxy-freebsd-amd64" || echo "Failed to package freebsd"
          elif [ "${matrix.goos}" = "linux" ] && [ "${matrix.goarch}" = "amd64" ]; then
            tar czf "proxy-linux-amd64.tar.gz" "proxy-linux-amd64" || echo "Failed to package linux-amd64"
          elif [ "${matrix.goos}" = "linux" ] && [ "${matrix.goarch}" = "arm64" ]; then
            tar czf "proxy-linux-arm64.tar.gz" "proxy-linux-arm64" || echo "Failed to package linux-arm64"
          fi

      - name: Package Windows zip
        if: matrix.goos == 'windows' && matrix.goarch == 'amd64'
        shell: bash |
          zip proxy-windows-amd64.zip proxy-windows-amd64.exe || echo "Failed to zip windows"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxy-${{ needs.version.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            *.tar.gz
            *.zip
        retention-days: 30

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          files: |
            dist/*.tar.gz
            dist/*.zip
          draft: false
          prerelease: false
