name: Build and Release

on:
  workflow_dispatch:
  push:
    paths:
      - "VERSION"

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          v=$(cat VERSION | tr -d ' \t\n\r')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            name: linux-amd64
          - os: linux
            arch: arm64
            name: linux-arm64
          - os: linux
            arch: arm
            armv: 7
            name: armv7hf-linux
          - os: windows
            arch: amd64
            name: windows-amd64
          - os: darwin
            arch: amd64
            name: mac-intel
          - os: darwin
            arch: arm64
            name: mac-arm64
          - os: freebsd
            arch: amd64
            name: freebsd-amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          GOARM: ${{ matrix.armv }}
          CGO_ENABLED: 0
        run: |
          bin="proxy-${{ matrix.name }}"
          if [ "${{ matrix.os }}" = "windows" ]; then
            bin="$bin.exe"
          fi
          go build -o "$bin" .

      - name: Package tar.gz
        if: matrix.os != 'windows'
        run: |
          bin="proxy-${{ matrix.name }}"
          tar czf "${bin}.tar.gz" "$bin"

      - name: Package zip (Windows)
        if: matrix.os == 'windows'
        run: |
          zip proxy-windows-amd64.zip proxy-windows-amd64.exe

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: "*.tar.gz"
          retention-days: 30

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          files: "dist/**/*.tar.gz"
          draft: false
          prerelease: false
