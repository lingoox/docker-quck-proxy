name: Build & Distribute docker-quck-proxy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [created]

jobs:
  build-all-platforms:
    runs-on: ubuntu-latest

    # Ensure GITHUB_TOKEN has permission to create release assets
    permissions:
      contents: write
      pull-requests: write
      actions: read
      packages: read
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Build all platform binaries
      run: |
        # Helper function to build a binary for a platform
        build() {
          local platform=$4
          local output_name="proxy-$platform"
          # Windows executables need .exe extension
          if [[ "$1" == "windows" ]]; then
            output_name="${output_name}.exe"
          fi
          GOOS=$1 GOARCH=$2 GOARM="${3:-}" CGO_ENABLED=0 go build -o "$output_name" .
          echo "Built $output_name"
        }

        # Linux x86_64
        build linux amd64 "" linux-amd64

        # Linux ARM64
        build linux arm64 "" linux-arm64

        # Linux ARMv7 hard-float (Armbian)
        build linux arm 7 armv7hf-linux

        # Windows x86_64 (will produce proxy-windows-amd64.exe)
        build windows amd64 "" windows-amd64

        # macOS Intel
        build darwin amd64 "" mac-intel

        # macOS ARM64 (Apple Silicon)
        build darwin arm64 "" mac-arm64

        # FreeBSD
        build freebsd amd64 "" freebsd-amd64

        echo "All binaries:"
        ls -lh proxy-*

    - name: Create packages
      run: |
        # Create tar.gz for Unix-like platforms
        tar czf proxy-linux-amd64.tar.gz proxy-linux-amd64
        tar czf proxy-linux-arm64.tar.gz proxy-linux-arm64
        tar czf proxy-armv7hf-linux.tar.gz proxy-armv7hf-linux
        tar czf proxy-mac-intel.tar.gz proxy-mac-intel
        tar czf proxy-mac-arm64.tar.gz proxy-mac-arm64
        tar czf proxy-freebsd-amd64.tar.gz proxy-freebsd-amd64

        # Create zip for Windows
        zip proxy-windows-amd64.zip proxy-windows-amd64.exe

        echo "Packages:"
        ls -lh proxy-*.tar.gz proxy-*.zip

    - name: Upload artifacts (for PR/push)
      uses: actions/upload-artifact@v4
      with:
        name: docker-quck-proxy-binaries
        path: |
          proxy-*.tar.gz
          proxy-*.zip
        retention-days: 30

    # ===== Step 4: Attach assets to Release using raw GitHub API (no third-party action) =====
    - name: Upload Release Assets via API
      if: github.event_name == 'release' && github.event.action == 'created'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_UPLOAD_URL: ${{ github.events.release.upload_url }}
      run: |
        # Expand the GitHub API upload URL template
        UPLOAD_URL="${RELEASE_UPLOAD_URL/{+upload_suffix}/}"

        echo "Using upload URL: $UPLOAD_URL"
        echo "Token available: ${#GITHUB_TOKEN} chars"

        for file in proxy-*.tar.gz proxy-*.zip; do
          if [ -f "$file" ]; then
            filename=$(basename "$file")
            echo "Uploading $filename..."

            # Use curl to directly upload to the release asset endpoint
            if curl -fsSL -X PUT \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --upload-file "$file" \
              "${UPLOAD_URL}?name=$filename"; then
              echo "✓ Successfully uploaded $filename"
            else
              echo "❌ Failed to upload $filename"
              exit 1
            fi
          else
            echo "⚠️  Warning: $file not found"
          fi
        done

        echo "✅ All Release assets attached successfully!"
