version: "3.9"

services:
  proxy:
    build: .
    container_name: docker-quck-proxy
    ports:
      - "${HOST_PORT:-5000}:5000"
    environment:
      - UPSTREAM=${UPSTREAM:-https://registry-1.docker.io}
      - LISTEN_ADDR=:5000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
